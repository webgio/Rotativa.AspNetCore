name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build library (all target frameworks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Rotativa.AspNetCore/Rotativa.AspNetCore.csproj -c Release

  test:
    name: Tests against ${{ matrix.source }} (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # project: demo app references the library project.
        # package: demo app references the packed .nupkg, to test the package itself.
        source: [project, package]
    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: >
          docker build -f Rotativa.AspNetCore.Tests/Dockerfile -t rotativa-tests
          --build-arg USE_ROTATIVA_PACKAGE=${{ matrix.source == 'package' }} .

      - name: Run tests
        run: docker run --rm rotativa-tests
